<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Brand typography: editorial serif + clean everyday sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&display=swap"
      rel="stylesheet"
    />

    <!-- Favicons / app icons derived from the brand mark -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#FFF0F5" />

    <title>Ayesha Herbal &amp; Beauty — Herbal Skincare &amp; Self-Care</title>
    <meta
      name="description"
      content="Everyday herbal beauty and self-care essentials from Ayesha Herbal & Beauty. Browse the collection and order directly on WhatsApp."
    />
    <!--
      Site-wide social card. WhatsApp / Facebook / Twitter scrapers do not run
      JavaScript, so these static tags are what they read for ANY url — values
      must be absolute. Per-page metadata is added by the app (Helmet) for
      JS-capable crawlers such as Google.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Ayesha Herbal &amp; Beauty" />
    <meta property="og:title" content="Ayesha Herbal &amp; Beauty — Herbal Skincare &amp; Self-Care" />
    <meta
      property="og:description"
      content="Everyday herbal beauty and self-care essentials. Browse the collection and order directly on WhatsApp."
    />
    <meta property="og:url" content="https://ayeshaherbalandbeauty.com/" />
    <meta
      property="og:image"
      content="https://ayeshaherbalandbeauty.com/og-image.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Ayesha Herbal &amp; Beauty" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
